<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assistant">
<meta name="theme-color" content="#ffffff">
<title>Assistant Gemini</title>
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { height: 100%; margin: 0; -webkit-text-size-adjust: 100%; }
body { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 16px; background: #fff; color: #1f1f1f; }
button, select, input, textarea { font-family: inherit; }
#app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }

#top { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 8px 8px 6px; padding-top: calc(8px + env(safe-area-inset-top)); background: #fff; }
.ib { width: 40px; height: 40px; font-size: 20px; border: 0; border-radius: 20px; background: transparent; color: #444; padding: 0; }
#title { -webkit-flex: 1; flex: 1; min-width: 0; font-size: 18px; font-weight: 600; margin: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp { color: #4285f4; background: -webkit-linear-gradient(left, #4285f4, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#model { max-width: 118px; font-size: 14px; padding: 7px 8px; border-radius: 16px; border: 1px solid #d3dbe5; background: #f0f4f9; color: #1f1f1f; -webkit-appearance: none; margin-right: 2px; }

#msgs { -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 14px 6px; }
.row { margin-bottom: 16px; }
.row.u { text-align: right; }
.u .m { display: inline-block; text-align: left; max-width: 86%; background: #e9eef6; padding: 10px 14px; border-radius: 20px 20px 6px 20px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.42; }
.a .m { line-height: 1.5; word-wrap: break-word; }
.t { white-space: pre-wrap; }
.a .m pre { white-space: pre-wrap; word-wrap: break-word; background: #f0f4f9; padding: 10px 12px; border-radius: 12px; font-family: Menlo, Courier, monospace; font-size: 13px; margin: 8px 0; overflow-x: auto; line-height: 1.4; }
.a .m pre.out { background: #e6f4ea; }
.a .m pre.bad { background: #fde8e6; }
.m code { background: #eef2f7; padding: 1px 5px; border-radius: 5px; font-family: Menlo, Courier, monospace; font-size: 14px; }
.m img { max-width: 100%; border-radius: 14px; display: block; margin: 8px 0; }
.u .m img { max-width: 130px; display: inline-block; margin: 0 6px 6px 0; }
.ph { display: inline-block; font-size: 13px; color: #666; background: #f0f4f9; padding: 4px 10px; border-radius: 10px; margin: 4px 0; }
.src { font-size: 13px; margin-top: 8px; color: #555; }
.src a { display: inline-block; color: #1a5fb4; background: #eef3fb; padding: 3px 9px; border-radius: 12px; margin: 3px 4px 0 0; text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
.err { color: #a3281b; background: #fde8e6; padding: 10px 14px; border-radius: 14px; }
.acts { margin-top: 4px; }
.act { font-size: 13px; padding: 5px 11px; margin: 2px 6px 0 0; border-radius: 14px; border: 1px solid #d3dbe5; background: #fff; color: #444; }
.dots span { display: inline-block; width: 8px; height: 8px; margin: 0 2px; border-radius: 50%; background: #8ab4f8; -webkit-animation: bl 1.2s infinite ease-in-out; animation: bl 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { -webkit-animation-delay: .2s; animation-delay: .2s; }
.dots span:nth-child(3) { -webkit-animation-delay: .4s; animation-delay: .4s; }
@-webkit-keyframes bl { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@keyframes bl { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.empty { padding: 28px 4px 6px; }
.empty .hi { font-size: 32px; font-weight: 700; line-height: 1.15; margin-bottom: 4px; background: #4285f4; background: -webkit-linear-gradient(left, #4285f4, #9b72cb 55%, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.empty .q { font-size: 26px; font-weight: 600; color: #b4b9c1; margin-bottom: 8px; }
.empty .hh { font-size: 14px; color: #666; margin-bottom: 16px; line-height: 1.4; }
.chip { display: block; width: 100%; text-align: left; font-size: 15px; padding: 12px 14px; margin-bottom: 8px; border-radius: 16px; border: 0; background: #f0f4f9; color: #1f1f1f; }

#dock { padding: 6px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); background: #fff; }
#status { display: none; font-size: 13px; color: #555; padding: 0 6px 6px; }
#thumbs { white-space: nowrap; overflow-x: auto; }
.th { position: relative; display: inline-block; margin: 0 8px 6px 0; }
.th img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; display: block; }
.th b { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; line-height: 20px; text-align: center; font-size: 12px; background: #444; color: #fff; border-radius: 10px; }
#box { background: #f0f4f9; border-radius: 26px; padding: 8px 10px 6px 14px; }
#txt { width: 100%; border: 0; background: transparent; font-size: 16px; resize: none; height: 24px; max-height: 120px; line-height: 24px; padding: 0; outline: none; -webkit-appearance: none; }
#tools { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-top: 6px; }
.tl { font-size: 17px; padding: 5px 12px; margin-right: 6px; border-radius: 16px; border: 1px solid #cfd8e3; background: transparent; color: #444; }
.tl.rec { background: #d93025; border-color: #d93025; color: #fff; }
.tl.on { background: #d3e3fd; border-color: #d3e3fd; color: #0b3d91; font-weight: 600; }
#send { margin-left: auto; width: 40px; height: 36px; font-size: 17px; border: 0; border-radius: 18px; background: #1a73e8; color: #fff; padding: 0; }
#send.stop { background: #444; }

#shade { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 20; }
#drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 82%; max-width: 330px; background: #fff; z-index: 30; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 12px; padding-top: calc(14px + env(safe-area-inset-top)); -webkit-transform: translateX(-105%); transform: translateX(-105%); -webkit-transition: -webkit-transform .22s; transition: transform .22s; }
#drawer.open { -webkit-transform: none; transform: none; }
.dh { font-size: 12px; font-weight: 700; color: #777; text-transform: uppercase; margin: 16px 6px 6px; letter-spacing: .5px; }
.di { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; width: 100%; text-align: left; font-size: 15px; padding: 10px; border: 0; border-radius: 14px; background: transparent; color: #1f1f1f; }
.di.on { background: #e9eef6; }
.di span.l { -webkit-flex: 1; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.di i { font-style: normal; color: #888; padding: 0 6px; }
.newb { width: 100%; font-size: 15px; font-weight: 600; padding: 12px; border: 0; border-radius: 22px; background: #d3e3fd; color: #0b3d91; }

#sheet { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 40; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; padding-top: calc(14px + env(safe-area-inset-top)); }
#sheet h2 { font-size: 20px; margin: 0 0 6px; }
#sheet label { display: block; font-size: 13px; font-weight: 600; margin-top: 14px; color: #444; }
#sheet input[type=text], #sheet input[type=password], #sheet select { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #cfd8e3; border-radius: 12px; margin-top: 4px; background: #f8fafd; -webkit-appearance: none; }
#sheet input[type=range] { width: 100%; margin-top: 6px; }
#sheet p { font-size: 13px; color: #666; line-height: 1.4; margin: 6px 0 0; }
.btn { display: block; width: 100%; font-size: 15px; padding: 12px; margin-top: 12px; border-radius: 22px; border: 1px solid #cfd8e3; background: #fff; color: #1f1f1f; }
.btn.pri { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 600; }
.btn.red { color: #a3281b; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ib" id="menu" type="button">☰</button>
    <div id="title"><span class="sp">✦</span> <span id="gname">Assistant</span></div>
    <select id="model"></select>
    <button class="ib" id="gear" type="button">⚙</button>
  </div>
  <div id="msgs"></div>
  <div id="dock">
    <div id="status"></div>
    <div id="thumbs"></div>
    <div id="box">
      <textarea id="txt" rows="1" placeholder="Écris ou dicte ton message"></textarea>
      <div id="tools">
        <button class="tl" id="att" type="button" title="Photo">📷</button>
        <button class="tl" id="mic" type="button" title="Parler">🎤</button>
        <button class="tl" data-tool="search" type="button" title="Recherche web">🔎</button>
        <button class="tl" data-tool="code" type="button" title="Code">🧮</button>
        <button class="tl" data-tool="image" type="button" title="Créer une image">🎨</button>
        <button id="send" type="button">➤</button>
      </div>
    </div>
  </div>
</div>

<div id="shade"></div>
<div id="drawer"></div>

<div id="sheet">
  <h2>Réglages</h2>
  <label>Clé API Gemini<input id="key" type="password" placeholder="AIza..." autocapitalize="off" autocorrect="off"></label>
  <p>Gratuite sur aistudio.google.com. Elle reste sur ce téléphone et n'est envoyée qu'à Google.</p>
  <label>Température : <span id="tval">1.0</span></label>
  <input id="temp" type="range" min="0" max="2" step="0.1" value="1">
  <p>Bas = réponses précises, haut = plus créatives.</p>
  <label>Réflexion<select id="think"><option value="fast">Rapide (réponses plus vite)</option><option value="auto">Automatique (plus approfondie)</option></select></label>
  <label>Voix<select id="voice"><option value="Kore">Kore</option><option value="Puck">Puck</option><option value="Charon">Charon</option><option value="Aoede">Aoede</option><option value="Zephyr">Zephyr</option><option value="Fenrir">Fenrir</option></select></label>
  <label>Lecture à voix haute<select id="vmode"><option value="gem">Naturelle (voix Gemini)</option><option value="sys">Simple (voix de l'iPhone)</option></select></label>
  <label>Lire chaque réponse automatiquement<select id="autoread"><option value="0">Non (sauf si je parle avec 🎤)</option><option value="1">Oui</option></select></label>
  <button class="btn" id="testvoice" type="button">🔊 Tester la voix</button>
  <label>Langue de la voix simple<select id="lang"><option value="fr-FR">Français</option><option value="en-US">English</option><option value="es-ES">Español</option><option value="de-DE">Deutsch</option><option value="it-IT">Italiano</option></select></label>
  <label>Modèle personnalisé (facultatif)<input id="cmodel" type="text" placeholder="ex. gemini-2.5-pro" autocapitalize="off" autocorrect="off"></label>
  <label>Modèle de génération d'images<input id="imodel" type="text" autocapitalize="off" autocorrect="off"></label>
  <label>Modèle de voix<input id="tmodel" type="text" autocapitalize="off" autocorrect="off"></label>
  <button class="btn" id="copyconv" type="button">📋 Copier la conversation</button>
  <button class="btn red" id="wipe" type="button">Effacer toutes mes données</button>
  <button class="btn pri" id="closeset" type="button">Terminé</button>
</div>
<input type="file" id="file" accept="image/*" style="display:none">

<script>
(function () {
  var BUILTIN = [
    { id: "general", icon: "💬", name: "Assistant", hint: "Pose-moi n'importe quelle question, envoie une photo ou active la recherche web.",
      sugg: ["Explique-moi comment fonctionne internet", "Quelles sont les actualités du jour ? (active 🔎 Web)", "Aide-moi à écrire un message pour refuser poliment une invitation"],
      system: "Tu es un assistant utile et amical. Réponds en français, de façon claire et concise, sauf si on te parle dans une autre langue." },
    { id: "trad", icon: "🌍", name: "Traducteur", hint: "Écris ou photographie un texte : je le traduis (français ↔ anglais par défaut).",
      sugg: ["Où est la gare, s'il vous plaît ?", "Could you tell me how to get to the airport?", "Traduis en espagnol : bonne journée"],
      system: "Tu es un traducteur. Si le texte est en français, traduis-le en anglais ; sinon traduis-le en français, sauf si la personne demande une autre langue. Réponds uniquement avec la traduction, sans commentaire." },
    { id: "devoirs", icon: "📚", name: "Aide aux devoirs", hint: "Donne ton exercice (ou prends-le en photo) : je t'explique pas à pas.",
      sugg: ["Explique-moi les fractions simplement", "Comment accorder le participe passé ?", "Aide-moi à résoudre 2x + 5 = 17"],
      system: "Tu es un tuteur patient. Explique étape par étape en français, avec des mots simples et un exemple. Aide l'élève à comprendre plutôt que de donner juste la réponse, puis vérifie sa compréhension avec une petite question." },
    { id: "recettes", icon: "🍳", name: "Recettes", hint: "Dis-moi ce que tu as dans ton frigo (ou prends-le en photo).",
      sugg: ["J'ai des œufs, des pâtes et du fromage", "Un dessert rapide sans four", "Un dîner végétarien pour 4 personnes"],
      system: "Tu es un cuisinier qui propose des recettes simples en français. Indique les ingrédients avec les quantités, puis les étapes numérotées et le temps total. Si on te donne des ingrédients, propose des recettes qui les utilisent." },
    { id: "code", icon: "👨‍💻", name: "Programmeur", hint: "Aide pour écrire, comprendre ou corriger du code.",
      sugg: ["Explique ce qu'est une boucle for", "Écris une fonction Python qui trie une liste", "Pourquoi mon code affiche undefined ?"],
      system: "Tu es un développeur expérimenté. Réponds en français, avec des explications courtes et des exemples de code dans des blocs de code." }
  ];
  var MODELS = [
    { v: "gemini-2.5-flash", n: "2.5 Flash" },
    { v: "gemini-2.5-pro", n: "2.5 Pro" },
    { v: "gemini-2.5-flash-lite", n: "Flash-Lite" }
  ];
  var API = "https://generativelanguage.googleapis.com/v1beta/models/";
  var SEND_MAX = 16, KEEP_CONV = 30, KEEP_MSG = 40, MAX_IMGS = 4, HAS_TTS = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  var $ = function (id) { return document.getElementById(id); };

  function lget(k, d) { try { var r = localStorage.getItem(k); return r === null ? d : r; } catch (e) { return d; } }
  function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function jget(k, d) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }

  var S = { convs: jget("gm_convs", []), gems: jget("gm_gems", []), cur: null, tool: "", imgs: [], busy: false, xhr: null, speakBtn: null, viaMic: false };

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function inl(t) {
    t = esc(t.replace(/^\n+|\n+$/g, ""));
    t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    t = t.replace(/^#+ (.*)$/gm, "<b>$1</b>");
    t = t.replace(/^[\*\-] /gm, "• ");
    return t;
  }
  function fmt(t) {
    var p = t.split("```"), o = [], i, s, nl;
    for (i = 0; i < p.length; i++) {
      if (i % 2 === 1) {
        s = p[i]; nl = s.indexOf("\n");
        if (nl > -1 && nl < 20 && /^[a-zA-Z0-9+#_\-]*$/.test(s.slice(0, nl))) { s = s.slice(nl + 1); }
        o.push("<pre>" + esc(s.replace(/\n$/, "")) + "</pre>");
      } else { o.push(inl(p[i])); }
    }
    return o.join("");
  }
  function plain(t) { return t.replace(/[*`#]/g, "").replace(/^[\-•] /gm, ""); }

  function allGems() { return BUILTIN.concat(S.gems); }
  function gemOf(id) { var g = allGems(), i; for (i = 0; i < g.length; i++) { if (g[i].id === id) { return g[i]; } } return BUILTIN[0]; }
  function curGem() { return gemOf(S.cur.gemId); }

  function itemsText(items) {
    var o = "", i;
    for (i = 0; items && i < items.length; i++) { if (items[i].t === "text") { o += items[i].v; } }
    return o;
  }
  function stripItems(items) {
    var o = [], i;
    for (i = 0; items && i < items.length; i++) { o.push(items[i].t === "img" ? { t: "imgph" } : items[i]); }
    return o;
  }
  function saveConvs() {
    var out = [], i, j, c, m, ms;
    for (i = 0; i < S.convs.length && i < KEEP_CONV; i++) {
      c = S.convs[i]; ms = [];
      for (j = Math.max(0, c.msgs.length - KEEP_MSG); j < c.msgs.length; j++) {
        m = c.msgs[j];
        ms.push(m.role === "user" ? { role: "user", text: m.text, n: m.n } : { role: "model", items: stripItems(m.items) });
      }
      out.push({ id: c.id, title: c.title, gemId: c.gemId, msgs: ms });
    }
    lset("gm_convs", JSON.stringify(out));
  }
  function inList(c) { var i; for (i = 0; i < S.convs.length; i++) { if (S.convs[i] === c) { return true; } } return false; }
  function persist() {
    if (S.cur.msgs.length && !inList(S.cur)) { S.convs.unshift(S.cur); }
    if (S.convs.length > KEEP_CONV) { S.convs.length = KEEP_CONV; }
    saveConvs();
  }

  /* ---------- rendu ---------- */
  function renderItems(el, items) {
    var h = [], i, it, k;
    for (i = 0; i < items.length; i++) {
      it = items[i];
      if (it.t === "text") { h.push('<div class="t">' + fmt(it.v) + "</div>"); }
      else if (it.t === "code") { h.push("<pre>" + esc(it.v) + "</pre>"); }
      else if (it.t === "out") { h.push('<pre class="' + (it.ok ? "out" : "bad") + '">' + esc(it.v) + "</pre>"); }
      else if (it.t === "img") { h.push('<img alt="image générée" src="data:' + esc(it.mime) + ";base64," + it.data + '"><div class="ph">Maintiens l\'image appuyée pour l\'enregistrer</div>'); }
      else if (it.t === "imgph") { h.push('<span class="ph">🖼 image générée (non conservée)</span>'); }
      else if (it.t === "src") {
        h.push('<div class="src">Sources :<br>');
        for (k = 0; k < it.list.length; k++) { h.push('<a href="' + esc(it.list[k].u) + '" target="_blank" rel="noopener">' + esc(it.list[k].n) + "</a>"); }
        h.push("</div>");
      }
    }
    el.innerHTML = h.join("");
  }
  function nearBottom() { var m = $("msgs"); return m.scrollHeight - m.scrollTop - m.clientHeight < 120; }
  function scrollDown() { var m = $("msgs"); m.scrollTop = m.scrollHeight; }

  /* ---------- voix : lecture naturelle (Gemini) + micro ---------- */
  var AC = window.AudioContext || window.webkitAudioContext, actx = null, playing = null, playToken = 0, rec = null;
  function unlockAudio() {
    if (!AC) { return; }
    if (!actx) { try { actx = new AC(); } catch (e) { return; } }
    if (actx.state === "suspended" && actx.resume) { actx.resume(); }
    try {
      var b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource();
      s.buffer = b; s.connect(actx.destination);
      if (s.start) { s.start(0); } else { s.noteOn(0); }
    } catch (e2) {}
  }
  function setStatus(m) { var el = $("status"); el.textContent = m || ""; el.style.display = m ? "block" : "none"; }
  function speechText(t) { return plain(t.replace(/```[\s\S]*?```/g, " ")); }
  function endSpeak() {
    playing = null;
    if (S.speakBtn) { S.speakBtn.textContent = "🔊 Écouter"; S.speakBtn = null; }
  }
  function stopSpeak() {
    playToken++;
    if (playing) { try { if (playing.stop) { playing.stop(0); } else { playing.noteOff(0); } } catch (e) {} }
    if (HAS_TTS) { try { window.speechSynthesis.cancel(); } catch (e2) {} }
    endSpeak();
  }
  function chunkText(t) {
    var out = [], cur = "", parts = t.replace(/\s+/g, " ").match(/[^.!?…\n]+[.!?…]*\s*/g) || [t], i;
    for (i = 0; i < parts.length; i++) {
      if (cur && cur.length + parts[i].length > 400) { out.push(cur); cur = ""; }
      cur += parts[i];
    }
    if (cur) { out.push(cur); }
    return out.slice(0, 8);
  }
  function pcmToFloat(b64) {
    var bin = atob(b64), n = bin.length >> 1, f = new Float32Array(n), i, v;
    for (i = 0; i < n; i++) {
      v = (bin.charCodeAt(2 * i + 1) << 8) | bin.charCodeAt(2 * i);
      if (v >= 32768) { v -= 65536; }
      f[i] = v / 32768;
    }
    return f;
  }
  function fetchTts(t, cb) {
    var x = new XMLHttpRequest();
    x.open("POST", API + encodeURIComponent(lget("gm_tmodel", "gemini-2.5-flash-preview-tts")) + ":generateContent?key=" + encodeURIComponent(lget("gm_key", "")), true);
    x.setRequestHeader("content-type", "application/json");
    x.timeout = 60000;
    x.onload = function () {
      try { var j = JSON.parse(x.responseText); cb(null, pcmToFloat(j.candidates[0].content.parts[0].inlineData.data)); } catch (e) { cb(e); }
    };
    x.onerror = function () { cb(new Error("réseau")); };
    x.ontimeout = function () { cb(new Error("délai")); };

      } catch (e) { return fail(e.message); }
      if (!items.length) {
        return fail(meta.blocked || meta.finish === "SAFETY" ? "Réponse bloquée par le filtre de sécurité." : "Réponse vide.");
      }
      finish(false);
    };
    xhr.onerror = function () { fail("Connexion impossible."); };
    xhr.ontimeout = function () { fail("Le serveur met trop de temps à répondre."); };
    xhr.onabort = function () { if (!finished) { finished = true; if (timer) { clearTimeout(timer); } S.xhr = null; setBusy(false); if (items.length) { finish(true); } else { fail2(); } } };
    function fail2() {
      conv.msgs.pop();
      if (conv === S.cur) { renderAll(); }
      $("txt").value = text; grow();
    }
    xhr.send(JSON.stringify(body));
  }

  function regenerate() {
    var ms = S.cur.msgs, u;
    if (S.busy || ms.length < 2 || ms[ms.length - 1].role !== "model") { return; }
    ms.pop(); u = ms.pop();
    renderAll(); ask(u.text || "", []);
  }

  /* ---------- interface ---------- */
  var txt = $("txt");
  function grow() { txt.style.height = "24px"; txt.style.height = Math.min(txt.scrollHeight, 120) + "px"; }
  txt.oninput = grow;
  $("send").onclick = function () {
    if (S.busy) { stopGen(); return; }
    ask(txt.value.replace(/^\s+|\s+$/g, ""), S.imgs.slice(0));
  };
  $("att").onclick = function () { $("file").click(); };
  $("mic").onclick = micToggle;
  $("file").onchange = function () { var f = this.files && this.files[0]; if (f) { addImageFile(f); } this.value = ""; };
  var tb = document.getElementsByClassName("tl"), ti;
  for (ti = 0; ti < tb.length; ti++) {
    if (tb[ti].getAttribute("data-tool")) {
      tb[ti].onclick = function () {
        var t = this.getAttribute("data-tool");
        S.tool = (S.tool === t) ? "" : t;
        var all = document.getElementsByClassName("tl"), q;
        for (q = 0; q < all.length; q++) { if (all[q].getAttribute("data-tool")) { all[q].className = "tl" + (all[q].getAttribute("data-tool") === S.tool ? " on" : ""); } }
        txt.placeholder = S.tool === "image" ? "Décris l'image à créer (ou joins une photo à modifier)" : S.tool === "search" ? "Recherche web activée : pose ta question" : S.tool === "code" ? "Code activé : demande un calcul ou un script" : "Écris ou dicte ton message";
      };
    }
  }
  $("menu").onclick = function () { drawer(true); };
  $("shade").onclick = function () { drawer(false); };

  var sel = $("model"), mi;
  for (mi = 0; mi < MODELS.length; mi++) { var op = document.createElement("option"); op.value = MODELS[mi].v; op.textContent = MODELS[mi].n; sel.appendChild(op); }
  sel.value = lget("gm_model", MODELS[0].v);
  sel.onchange = function () { lset("gm_model", sel.value); lset("gm_cmodel", ""); $("cmodel").value = ""; };

  $("gear").onclick = function () { $("sheet").style.display = "block"; };
  $("closeset").onclick = function () {
    $("sheet").style.display = "none";
    lset("gm_key", $("key").value);
    lset("gm_temp", $("temp").value);
    lset("gm_think", $("think").value);
    lset("gm_voice", $("voice").value);
    lset("gm_vmode", $("vmode").value);
    lset("gm_auto", $("autoread").value);
    lset("gm_lang", $("lang").value);
    lset("gm_cmodel", $("cmodel").value);
    lset("gm_imodel", $("imodel").value);
    lset("gm_tmodel", $("tmodel").value);
  };
  $("temp").oninput = function () { $("tval").textContent = this.value; };
  $("testvoice").onclick = function () { speakText("Bonjour ! Je suis ton assistant. Comment puis-je t'aider ?", null); };
  $("copyconv").onclick = function () {
    var out = "", i, m;
    for (i = 0; i < S.cur.msgs.length; i++) {
      m = S.cur.msgs[i];
      out += (m.role === "user" ? "Toi : " + (m.text || "") : "Assistant : " + itemsText(m.items)) + "\n\n";
    }
    copyText(out);
    $("copyconv").textContent = "✓ Copié";
    setTimeout(function () { $("copyconv").textContent = "📋 Copier la conversation"; }, 1400);
  };
  $("wipe").onclick = function () {
    if (!window.confirm("Effacer toutes les conversations, Gems et réglages ?")) { return; }
    try { localStorage.clear(); } catch (e) {}
    S.convs = []; S.gems = []; newConv("general");
    $("key").value = ""; $("cmodel").value = ""; $("imodel").value = ""; $("tmodel").value = "";
    $("sheet").style.display = "none";
  };

  function loadSettings() {
    $("key").value = lget("gm_key", "");
    $("temp").value = lget("gm_temp", "1");
    $("tval").textContent = $("temp").value;
    $("think").value = lget("gm_think", "fast");
    $("voice").value = lget("gm_voice", "Kore");
    $("vmode").value = lget("gm_vmode", "gem");
    $("autoread").value = lget("gm_auto", "0");
    $("lang").value = lget("gm_lang", "fr-FR");
    $("cmodel").value = lget("gm_cmodel", "");
    $("imodel").value = lget("gm_imodel", "");
    $("tmodel").value = lget("gm_tmodel", "");
  }

  loadSettings();
  S.cur = S.convs.length ? S.convs[0] : { id: String(new Date().getTime()), title: "Nouvelle discussion", gemId: "general", msgs: [] };
  renderAll();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon IA">
<title>Mon IA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f2f2f7;color:#1c1c1e;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
header{background:#1c1c1e;color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
header h1{font-size:17px;margin:0}
header button{background:none;border:0;color:#0a84ff;font-size:15px;margin-left:14px}
#chat{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.msg{max-width:85%;padding:9px 13px;border-radius:18px;margin-bottom:10px;line-height:1.4;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.user{background:#0a84ff;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:#fff;border-bottom-left-radius:4px}
.err{background:#ffe5e5;color:#b00020}
form{display:-webkit-flex;display:flex;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #d1d1d6}
#q{-webkit-flex:1;flex:1;font-size:16px;border:1px solid #c7c7cc;border-radius:18px;padding:9px 14px;-webkit-appearance:none;outline:0;margin-right:8px}
#send{background:#0a84ff;color:#fff;border:0;border-radius:18px;padding:0 18px;font-size:16px}
#send:disabled{opacity:.5}
#cfg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9;padding:20px;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#cfg.on{display:-webkit-flex;display:flex}
#box{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px}
#box label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
#box input,#box textarea{width:100%;font-size:16px;border:1px solid #c7c7cc;border-radius:8px;padding:8px;font-family:inherit}
#box textarea{height:70px}
#box button{margin-top:14px;width:100%;background:#0a84ff;color:#fff;border:0;border-radius:10px;padding:11px;font-size:16px}
#box small{display:block;margin-top:8px;color:#777;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Mon IA</h1>
  <div><button id="clr">Effacer</button><button id="set">Réglages</button></div>
</header>
<div id="chat"></div>
<form id="f">
  <input id="q" type="text" placeholder="Écris ton message…" autocomplete="off">
  <button id="send" type="submit">Envoyer</button>
</form>

<div id="cfg"><div id="box">
  <strong>Réglages Gemini</strong>
  <label>Clé API Gemini</label>
  <input id="key" type="password" placeholder="AIza…" autocomplete="off">
  <label>Modèle</label>
  <input id="model" type="text">
  <label>Consigne système (personnalité de l’IA)</label>
  <textarea id="sys"></textarea>
  <button id="save">Enregistrer</button>
  <small>La clé reste uniquement sur cet appareil (stockage local). Crée-en une gratuitement sur aistudio.google.com.</small>
</div></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var chat = $('chat'), q = $('q'), send = $('send');
  var history = [];
  var D = { key: '', model: 'gemini-2.5-flash', sys: 'Tu es un assistant utile. Réponds en français, de façon claire et concise.' };

  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var cfg = {
    key: load('g_key') || D.key,
    model: load('g_model') || D.model,
    sys: load('g_sys') || D.sys
  };
  try { history = JSON.parse(load('g_hist') || '[]'); } catch (e) { history = []; }

  function add(text, cls) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function render() {
    chat.innerHTML = '';
    if (!history.length) add('Bonjour ! Pose-moi une question.', 'bot');
    for (var i = 0; i < history.length; i++) {
      add(history[i].parts[0].text, history[i].role === 'user' ? 'user' : 'bot');
    }
  }

  function openCfg() {
    $('key').value = cfg.key; $('model').value = cfg.model; $('sys').value = cfg.sys;
    $('cfg').className = 'on';
  }

  $('set').onclick = openCfg;
  $('save').onclick = function () {
    cfg.key = $('key').value.replace(/\s/g, '');
    cfg.model = $('model').value.replace(/\s/g, '') || D.model;
    cfg.sys = $('sys').value || D.sys;
    store('g_key', cfg.key); store('g_model', cfg.model); store('g_sys', cfg.sys);
    $('cfg').className = '';
  };
  $('clr').onclick = function () { history = []; store('g_hist', '[]'); render(); };

  $('f').onsubmit = function (e) {
    e.preventDefault();
    var text = q.value.replace(/^\s+|\s+$/g, '');
    if (!text) return;
    if (!cfg.key) { openCfg(); return; }
    q.value = '';
    history.push({ role: 'user', parts: [{ text: text }] });
    add(text, 'user');
    var wait = add('…', 'bot');
    send.disabled = true;

    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
      encodeURIComponent(cfg.model) + ':generateContent?key=' + encodeURIComponent(cfg.key);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 60000;

    function fail(msg) {
      history.pop();
      wait.className = 'msg err';
      wait.textContent = msg;
      send.disabled = false;
    }
    xhr.onerror = function () { fail('Erreur réseau. Vérifie ta connexion.'); };
    xhr.ontimeout = function () { fail('Délai dépassé. Réessaie.'); };
    xhr.onload = function () {
      var data;
      try { data = JSON.parse(xhr.responseText); } catch (err) { return fail('Réponse illisible.'); }
      if (xhr.status !== 200) {
        return fail('Erreur ' + xhr.status + ' : ' + (data && data.error && data.error.message ? data.error.message : 'inconnue'));
      }
      var out = '';
      try {
        var parts = data.candidates[0].content.parts;
        for (var i = 0; i < parts.length; i++) out += parts[i].text || '';
      } catch (err) {}
      if (!out) return fail('Aucune réponse (contenu bloqué ?).');
      history.push({ role: 'model', parts: [{ text: out }] });
      store('g_hist', JSON.stringify(history.slice(-40)));
      wait.textContent = out;
      chat.scrollTop = chat.scrollHeight;
      send.disabled = false;
    };
    xhr.send(JSON.stringify({
      systemInstruction: { parts: [{ text: cfg.sys }] },
      contents: history.slice(-40)
    }));
  };

  render();
  if (!cfg.key) openCfg();
})();
</script>
</body>
</html>
